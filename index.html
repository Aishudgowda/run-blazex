<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Run Blaze</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07111d;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.screen{
  width:100%;
  height:100%;
}

.home{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 15%,#176d8e 0%,#0b3048 38%,#07111d 78%);
  color:white;
}

.homeBox{
  width:min(92%,520px);
  padding:24px;
}

.logo{
  font-size:68px;
  margin-bottom:5px;
}

.title{
  font-size:46px;
  font-weight:900;
  letter-spacing:2px;
}

.tag{
  color:#ffd43b;
  font-size:18px;
  margin:8px 0 22px;
  font-weight:700;
}

.runnerPreview{
  font-size:72px;
  margin:10px 0 22px;
}

.play{
  width:min(90%,330px);
  padding:18px;
  border-radius:18px;
  background:#20e6a0;
  color:#06251b;
  font-size:25px;
  font-weight:900;
  box-shadow:0 8px 30px #0008;
}

.smallRow{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:15px;
}

.smallBtn{
  padding:13px 24px;
  border-radius:14px;
  background:#ffffff18;
  color:white;
  border:1px solid #ffffff25;
  font-weight:800;
}

.features{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:22px;
}

.pill{
  background:#ffffff18;
  border:1px solid #ffffff20;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
}

.brand{
  margin-top:25px;
  opacity:.55;
  font-size:12px;
}

.game{
  display:none;
  position:relative;
  background:#07111d;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  color:white;
  font-weight:900;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

.hudLeft,.hudRight{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hudBox{
  background:#07111dcc;
  border:1px solid #ffffff20;
  border-radius:12px;
  padding:8px 11px;
}

.controls{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
}

.ctrl{
  width:64px;
  height:64px;
  border-radius:50%;
  background:#ffffffcc;
  color:#06251b;
  font-size:27px;
  font-weight:900;
  box-shadow:0 5px 15px #0005;
}

.ctrl.jump{
  background:#ffd43b;
}

.ctrl.boost{
  background:#ff7043;
}

.gameOver{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#0009;
  color:white;
}

.overBox{
  width:min(88%,390px);
  padding:30px;
  border-radius:22px;
  background:#102235;
  box-shadow:0 20px 60px #000;
}

.overBox h2{
  color:#ffd43b;
  font-size:38px;
  margin-bottom:14px;
}

.stat{
  font-size:18px;
  margin:7px;
}

.again{
  margin-top:18px;
  padding:14px 25px;
  border-radius:14px;
  background:#20e6a0;
  color:#06251b;
  font-size:18px;
  font-weight:900;
}

@media(max-width:600px){
  .title{
    font-size:38px;
  }

  .logo{
    font-size:55px;
  }

  .runnerPreview{
    font-size:60px;
  }

  .ctrl{
    width:58px;
    height:58px;
  }

  .controls{
    gap:8px;
  }
}
</style>
</head>

<body>

<section id="home" class="screen home">
  <div class="homeBox">
    <div class="logo">🔥🏃</div>
    <div class="title">RUN BLAZE</div>
    <div class="tag">Run. Collect. Survive.</div>

    <div class="runnerPreview">🏃‍♂️</div>

    <button class="play" onclick="startGame()">▶ PLAY</button>

    <div class="smallRow">
      <button class="smallBtn">🛒 SHOP</button>
      <button class="smallBtn">🎯 MISSIONS</button>
    </div>

    <div class="features">
      <span class="pill">🧲 Magnet</span>
      <span class="pill">⚡ Boost</span>
      <span class="pill">🎁 Gift</span>
      <span class="pill">🛹 Skate</span>
      <span class="pill">🔑 Keys</span>
      <span class="pill">⭐ Stars</span>
    </div>

    <div class="brand">PLAYTECH STUDIO</div>
  </div>
</section>

<section id="game" class="screen game">

  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="hudLeft">
      <div class="hudBox">🏃 <span id="score">0</span></div>
      <div class="hudBox">🪙 <span id="coins">0</span></div>
      <div class="hudBox">⭐ <span id="stars">0</span></div>
    </div>

    <div class="hudRight">
      <div class="hudBox">🔑 <span id="keys">0</span></div>
      <div class="hudBox">🏆 <span id="best">0</span></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" onclick="moveLeft()">◀</button>
    <button class="ctrl jump" onclick="jump()">▲</button>
    <button class="ctrl boost" onclick="boost()">●</button>
    <button class="ctrl" onclick="moveRight()">▶</button>
  </div>

  <div id="gameOver" class="gameOver">
    <div class="overBox">
      <h2>GAME OVER</h2>
      <div class="stat">Score: <b id="finalScore">0</b></div>
      <div class="stat">Coins: <b id="finalCoins">0</b></div>
      <div class="stat">Best: <b id="finalBest">0</b></div>
      <button class="again" onclick="startGame()">🔥 PLAY AGAIN</button>
    </div>
  </div>

</section>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  W = window.innerWidth;
  H = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

const home = document.getElementById("home");
const game = document.getElementById("game");
const gameOverBox = document.getElementById("gameOver");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const starsEl = document.getElementById("stars");
const keysEl = document.getElementById("keys");
const bestEl = document.getElementById("best");

let running = false;
let lastTime = 0;

let score = 0;
let coins = 0;
let stars = 0;
let keys = 0;

let best = Number(localStorage.getItem("runBlazeBest") || 0);

bestEl.textContent = best;

let lane = 1;
let targetLane = 1;

let playerX = 0;
let playerY = 0;

let jumpY = 0;
let jumpVelocity = 0;
let onGround = true;

let worldSpeed = 0.42;
let boostTimer = 0;
let magnetTimer = 0;
let skateTimer = 0;

let roadOffset = 0;

let objects = [];
let spawnTimer = 0;

function laneX(laneIndex){
  const center = W / 2;
  const laneWidth = Math.min(W * 0.22,120);
  return center + (laneIndex - 1) * laneWidth;
}

function startGame(){

  home.style.display = "none";
  game.style.display = "block";
  gameOverBox.style.display = "none";

  score = 0;
  coins = 0;
  stars = 0;
  keys = 0;

  lane = 1;
  targetLane = 1;

  playerX = laneX(1);
  playerY = H * 0.76;

  jumpY = 0;
  jumpVelocity = 0;
  onGround = true;

  worldSpeed = 0.42;
  boostTimer = 0;
  magnetTimer = 0;
  skateTimer = 0;

  objects = [];
  spawnTimer = 0;
  roadOffset = 0;

  running = true;
  lastTime = performance.now();

  updateHUD();

  requestAnimationFrame(loop);
}

function endGame(){

  if(!running) return;

  running = false;

  if(score > best){
    best = Math.floor(score);
    localStorage.setItem("runBlazeBest",best);
  }

  document.getElementById("finalScore").textContent = Math.floor(score);
  document.getElementById("finalCoins").textContent = coins;
  document.getElementById("finalBest").textContent = best;

  gameOverBox.style.display = "flex";
  bestEl.textContent = best;
}

function moveLeft(){
  if(!running) return;

  targetLane = Math.max(0,targetLane - 1);
}

function moveRight(){
  if(!running) return;

  targetLane = Math.min(2,targetLane + 1);
}

function jump(){

  if(!running) return;

  if(onGround){
    onGround = false;
    jumpVelocity = 720;
  }
}

function boost(){

  if(!running) return;

  boostTimer = 3;
}

function spawnObject(){

  const types = [
    "coin",
    "coin",
    "coin",
    "star",
    "key",
    "gift",
    "magnet",
    "boost",
    "skate",
    "obstacle"
  ];

  const type = types[Math.floor(Math.random() * types.length)];

  objects.push({
    type:type,
    lane:Math.floor(Math.random() * 3),
    z:1,
    collected:false,
    spin:Math.random() * Math.PI * 2
  });
}

function updateObjects(dt){

  const speed = worldSpeed + (boostTimer > 0 ? 0.35 : 0);

  for(let i=objects.length-1;i>=0;i--){

    const o = objects[i];

    o.z -= speed * dt;
    o.spin += dt * 5;

    if(o.z < -0.12){
      objects.splice(i,1);
      continue;
    }

    const sameLane =
      o.lane === targetLane ||
      o.lane === lane;

    const collectDistance = 0.12;

    if(
      sameLane &&
      o.z < collectDistance &&
      o.z > -0.02 &&
      !o.collected
    ){

      if(o.type === "obstacle"){

        if(jumpY > 65 || skateTimer > 0){
          o.collected = true;
        }else{
          endGame();
          return;
        }

      }else{

        o.collected = true;

        if(o.type === "coin"){
          coins++;
          score += 50;
        }

        if(o.type === "star"){
          stars++;
          score += 100;
        }

        if(o.type === "key"){
          keys++;
          score += 150;
        }

        if(o.type === "gift"){
          score += 250;
        }

        if(o.type === "magnet"){
          magnetTimer = 6;
          score += 50;
        }

        if(o.type === "boost"){
          boostTimer = 5;
          score += 50;
        }

        if(o.type === "skate"){
          skateTimer = 7;
          score += 50;
        }
      }
    }

    if(
      magnetTimer > 0 &&
      o.type === "coin" &&
      o.z < 0.55 &&
      o.z > 0.05
    ){
      if(Math.abs(o.lane - targetLane) <= 1){
        o.lane = targetLane;
      }
    }

    if(o.collected){
      objects.splice(i,1);
    }
  }
}

function updatePlayer(dt){

  const targetX = laneX(targetLane);

  playerX +=
    (targetX - playerX) *
    Math.min(1,dt * 12);

  lane =
    playerX < laneX(1) - 20 ? 0 :
    playerX > laneX(1) + 20 ? 2 : 1;

  if(!onGround){

    jumpY += jumpVelocity * dt;

    jumpVelocity -= 1700 * dt;

    if(jumpY <= 0){
      jumpY = 0;
      jumpVelocity = 0;
      onGround = true;
    }
  }
}

function update(dt){

  score += dt * (boostTimer > 0 ? 180 : 100);

  if(boostTimer > 0){
    boostTimer -= dt;
  }

  if(magnetTimer > 0){
    magnetTimer -= dt;
  }

  if(skateTimer > 0){
    skateTimer -= dt;
  }

  roadOffset +=
    dt * (boostTimer > 0 ? 2.2 : 1.4);

  updatePlayer(dt);
  updateObjects(dt);

  spawnTimer -= dt;

  if(spawnTimer <= 0){

    spawnObject();

    spawnTimer =
      Math.max(
        0.28,
        0.72 - score / 30000
      );
  }

  updateHUD();
}

function updateHUD(){

  scoreEl.textContent = Math.floor(score);
  coinsEl.textContent = coins;
  starsEl.textContent = stars;
  keysEl.textContent = keys;
}

function drawBackground(){

  const sky = ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#0b6d91");
  sky.addColorStop(.45,"#27a8c4");
  sky.addColorStop(1,"#0b3048");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  /* distant mountains */

  ctx.fillStyle = "#0b5063";

  ctx.beginPath();
  ctx.moveTo(0,H*.48);
  ctx.lineTo(W*.18,H*.28);
  ctx.lineTo(W*.35,H*.48);
  ctx.lineTo(W*.55,H*.24);
  ctx.lineTo(W*.78,H*.48);
  ctx.lineTo(W,H*.30);
  ctx.lineTo(W,H*.58);
  ctx.lineTo(0,H*.58);
  ctx.closePath();
  ctx.fill();

  /* side ground */

  ctx.fillStyle = "#18a0ad";

  ctx.fillRect(0,H*.48,W,H*.52);
}

function drawRoad(){

  const topY = H * 0.18;
  const bottomY = H;

  const topWidth = W * 0.28;
  const bottomWidth = W * 0.92;

  const cx = W / 2;

  /* road */

  ctx.fillStyle = "#34475a";

  ctx.beginPath();
  ctx.moveTo(cx-topWidth/2,topY);
  ctx.lineTo(cx+topWidth/2,topY);
  ctx.lineTo(cx+bottomWidth/2,bottomY);
  ctx.lineTo(cx-bottomWidth/2,bottomY);
  ctx.closePath();
  ctx.fill();

  /* road edges */

  ctx.strokeStyle = "#ff765c";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(cx-topWidth/2,topY);
  ctx.lineTo(cx-bottomWidth/2,bottomY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+topWidth/2,topY);
  ctx.lineTo(cx+bottomWidth/2,bottomY);
  ctx.stroke();

  /* moving lane lines */

  const dashCount = 14;

  for(let i=0;i<dashCount;i++){

    let p =
      ((i / dashCount) + roadOffset) % 1;

    let y =
      topY + Math.pow(p,1.65) * (bottomY-topY);

    let half =
      topWidth/2 +
      (bottomWidth/2-topWidth/2) * p;

    let dashH =
      12 + p * 35;

    ctx.strokeStyle = "#ffffffcc";
    ctx.lineWidth = 3 + p * 3;
    ctx.setLineDash([dashH,dashH]);

    ctx.beginPath();

    ctx.moveTo(cx-half/3,y);
    ctx.lineTo(cx-half/3,y+dashH);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(cx+half/3,y);
    ctx.lineTo(cx+half/3,y+dashH);

    ctx.stroke();
  }

  ctx.setLineDash([]);
}

function perspectiveY(z){

  const topY = H * 0.22;
  const playerRoadY = H * 0.76;

  const p = 1 - z;

  return topY +
    Math.pow(p,1.65) *
    (playerRoadY-topY);
}

function perspectiveScale(z){

  return 0.25 + (1-z) * 1.05;
}

function drawObject(o){

  const y = perspectiveY(o.z);
  const scale = perspectiveScale(o.z);

  const x = laneX(o.lane);

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(scale,scale);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if(o.type === "coin"){

    ctx.rotate(o.spin);

    ctx.font = "42px Arial";
    ctx.fillText("🪙",0,0);

  }else if(o.type === "star"){

    ctx.font = "42px Arial";
    ctx.fillText("⭐",0,0);

  }else if(o.type === "key"){

    ctx.font = "42px Arial";
    ctx.fillText("🔑",0,0);

  }else if(o.type === "gift"){

    ctx.font = "45px Arial";
    ctx.fillText("🎁",0,0);

  }else if(o.type === "magnet"){

    ctx.font = "43px Arial";
    ctx.fillText("🧲",0,0);

  }else if(o.type === "boost"){

    ctx.font = "43px Arial";
    ctx.fillText("⚡",0,0);

  }else if(o.type === "skate"){

    ctx.font = "43px Arial";
    ctx.fillText("🛹",0,0);

}else if(o.type === "obstacle"){

  ctx.font = "64px Arial";
  ctx.fillText("🪨",0,0);
}
  }

  ctx.restore();
}

function drawPlayer(){

  const runTime = performance.now() / 100;

  const bob =
    onGround
      ? Math.sin(runTime * 1.8) * 5
      : 0;

  const tilt =
    onGround
      ? Math.sin(runTime * 1.8) * 0.06
      : 0;

  const scale =
    1 + Math.sin(runTime * 1.8) * 0.025;

  ctx.save();

  ctx.translate(
    playerX,
    playerY - jumpY + bob
  );

  ctx.rotate(tilt);
  ctx.scale(scale,scale);

  if(boostTimer > 0){

    ctx.shadowColor = "#ffd43b";
    ctx.shadowBlur = 25;
  }

  if(magnetTimer > 0){

    ctx.shadowColor = "#ff4fd8";
    ctx.shadowBlur = 18;
  }

  ctx.font = "70px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText("🏃‍♂️",0,0);

  ctx.restore();

  if(skateTimer > 0){

    ctx.font = "25px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      "🛹",
      playerX,
      playerY + 35
    );
  }
}

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();

  /* objects are drawn from far to near */

  const sorted =
    [...objects].sort(
      (a,b) => b.z - a.z
    );

  for(const o of sorted){
    drawObject(o);
  }

  drawPlayer();

  if(boostTimer > 0){

    ctx.fillStyle = "#ffd43b22";
    ctx.fillRect(0,0,W,H);

  }
}

function loop(time){

  if(!running) return;

  let dt =
    (time-lastTime)/1000;

  lastTime = time;

  dt = Math.min(dt,0.035);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* keyboard */

window.addEventListener("keydown",(e)=>{

  if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a"){
    moveLeft();
  }

  if(e.key === "ArrowRight" || e.key.toLowerCase() === "d"){
    moveRight();
  }

  if(
    e.key === "ArrowUp" ||
    e.key === " " ||
    e.key.toLowerCase() === "w"
  ){
    e.preventDefault();
    jump();
  }

  if(e.key.toLowerCase() === "b"){
    boost();
  }
});

/* swipe */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart",(e)=>{

  const t = e.changedTouches[0];

  touchStartX = t.clientX;
  touchStartY = t.clientY;

},{passive:true});

canvas.addEventListener("touchend",(e)=>{

  const t = e.changedTouches[0];

  const dx = t.clientX-touchStartX;
  const dy = t.clientY-touchStartY;

  if(Math.abs(dx)>45){

    if(dx<0){
      moveLeft();
    }else{
      moveRight();
    }

  }else if(dy<-45){

    jump();
  }

},{passive:true});

</script>

</body>
</html>
