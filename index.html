<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Run Blaze</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050912;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#app{
  position:relative;
  width:100%;
  max-width:520px;
  height:100%;
  overflow:hidden;
  background:#101a27;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(#071322aa,#071322ee),
    radial-gradient(circle at 50% 20%,#2b5274,#07111d 65%);
  color:white;
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 5px 18px #000;
}

.studio{
  margin-top:8px;
  color:#9fb6c9;
  letter-spacing:3px;
  font-size:12px;
}

.character-select{
  display:flex;
  gap:14px;
  margin:28px 0 22px;
}

.char{
  width:110px;
  height:125px;
  border:2px solid #60788c;
  border-radius:18px;
  background:#102333;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.char.selected{
  border-color:#39d5ff;
  box-shadow:0 0 20px #39d5ff66;
}

.char-face{
  width:55px;
  height:55px;
  border-radius:50%;
  margin:0 auto 9px;
  background:#e2a77e;
  border:3px solid #263645;
}

.char-body{
  width:45px;
  height:42px;
  margin:auto;
  border-radius:12px 12px 6px 6px;
  background:#2379d8;
}

#girl .char-body{
  background:#d73570;
}

.play{
  width:220px;
  padding:17px;
  border:0;
  border-radius:40px;
  background:linear-gradient(90deg,#ff8a00,#ff3d00);
  color:white;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 25px #ff5b0055;
}

.small{
  margin-top:18px;
  color:#91a7b8;
  font-size:12px;
}

#hud{
  position:absolute;
  z-index:4;
  top:12px;
  left:12px;
  right:12px;
  display:none;
  justify-content:space-between;
  pointer-events:none;
}

.hudbox{
  padding:8px 12px;
  border-radius:12px;
  background:#06101dcc;
  border:1px solid #ffffff22;
  color:white;
  font-weight:bold;
}

#controls{
  position:absolute;
  z-index:6;
  bottom:20px;
  left:0;
  right:0;
  display:none;
  justify-content:center;
  gap:12px;
}

.ctrl{
  width:65px;
  height:55px;
  border:1px solid #ffffff44;
  border-radius:16px;
  background:#06101dcc;
  color:white;
  font-size:24px;
  font-weight:bold;
}

#gameOver{
  display:none;
}

.over-title{
  font-size:44px;
  font-weight:900;
  margin-bottom:20px;
}

.over-score{
  font-size:20px;
  margin-bottom:25px;
}

@media(max-width:430px){
  .logo{font-size:40px}
  .char{width:100px}
}
</style>
</head>

<body>

<div id="app">

<canvas id="gameCanvas"></canvas>

<div id="home" class="screen">

  <div class="logo">RUN BLAZE</div>
  <div class="studio">PLAYTECH STUDIO</div>

  <div class="character-select">

    <button id="boy" class="char selected" onclick="selectCharacter('boy')">
      <div class="char-face"></div>
      <div class="char-body"></div>
      BOY
    </button>

    <button id="girl" class="char" onclick="selectCharacter('girl')">
      <div class="char-face"></div>
      <div class="char-body"></div>
      GIRL
    </button>

  </div>

  <button class="play" onclick="startGame()">PLAY</button>

  <div class="small">RUN • JUMP • SLIDE • SURVIVE</div>

</div>

<div id="hud">

  <div class="hudbox">
    SCORE <span id="score">0</span>
  </div>

  <div class="hudbox">
    COINS <span id="coins">0</span>
  </div>

</div>

<div id="controls">

  <button class="ctrl" id="leftBtn">←</button>
  <button class="ctrl" id="jumpBtn">↑</button>
  <button class="ctrl" id="slideBtn">↓</button>
  <button class="ctrl" id="rightBtn">→</button>

</div>

<div id="gameOver" class="screen">

  <div class="over-title">GAME OVER</div>

  <div class="over-score">
    SCORE: <span id="finalScore">0</span>
  </div>

  <button class="play" onclick="startGame()">PLAY AGAIN</button>

  <div class="studio">PLAYTECH STUDIO</div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const home = document.getElementById("home");
const hud = document.getElementById("hud");
const controls = document.getElementById("controls");
const gameOver = document.getElementById("gameOver");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const finalScoreEl = document.getElementById("finalScore");

let W = 0;
let H = 0;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

let selectedCharacter = "boy";

let running = false;
let score = 0;
let coins = 0;
let speed = 7;

let lane = 1;
let targetLane = 1;

let jump = 0;
let jumping = false;
let sliding = false;

let objects = [];
let lastTime = 0;
let spawnTimer = 0;

function selectCharacter(type){

  selectedCharacter = type;

  document.getElementById("boy").classList.toggle(
    "selected",
    type === "boy"
  );

  document.getElementById("girl").classList.toggle(
    "selected",
    type === "girl"
  );
}

function startGame(){

  home.style.display = "none";
  gameOver.style.display = "none";

  hud.style.display = "flex";
  controls.style.display = "flex";

  score = 0;
  coins = 0;
  speed = 7;

  lane = 1;
  targetLane = 1;

  jump = 0;
  jumping = false;
  sliding = false;

  objects = [];

  running = true;

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function endGame(){

  if(!running) return;

  running = false;

  finalScoreEl.textContent = Math.floor(score);

  hud.style.display = "none";
  controls.style.display = "none";
  gameOver.style.display = "flex";
}

function moveLeft(){

  if(!running) return;

  targetLane = Math.max(0,targetLane - 1);
}

function moveRight(){

  if(!running) return;

  targetLane = Math.min(2,targetLane + 1);
}

function doJump(){

  if(!running || jumping) return;

  jumping = true;
  jump = 1;
}

function doSlide(){

  if(!running || jumping) return;

  sliding = true;

  setTimeout(()=>{
    sliding = false;
  },650);
}

document.getElementById("leftBtn").onclick = moveLeft;
document.getElementById("rightBtn").onclick = moveRight;
document.getElementById("jumpBtn").onclick = doJump;
document.getElementById("slideBtn").onclick = doSlide;

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key==="a") moveLeft();
  if(e.key==="ArrowRight" || e.key==="d") moveRight();
  if(e.key==="ArrowUp" || e.key==="w" || e.key===" ") doJump();
  if(e.key==="ArrowDown" || e.key==="s") doSlide();

});
function laneX(l){
  return W * (0.30 + l * 0.20);
}

function drawBackground(){

  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#071a2b");
  sky.addColorStop(0.55,"#31566c");
  sky.addColorStop(1,"#111820");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // distant city
  ctx.fillStyle="#172936";

  for(let i=0;i<18;i++){
    const bw=25+(i%4)*18;
    const bh=70+(i%6)*25;
    const x=i*38;
    ctx.fillRect(x,H*0.34-bh,bw,bh);
  }

  // railway area
  ctx.fillStyle="#20262b";
  ctx.fillRect(0,H*0.43,W,H*0.57);

  // tracks
  ctx.strokeStyle="#777d80";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(W*0.18,H);
  ctx.lineTo(W*0.38,H*0.43);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*0.82,H);
  ctx.lineTo(W*0.62,H*0.43);
  ctx.stroke();

  ctx.strokeStyle="#343a3e";
  ctx.lineWidth=3;

  for(let y=H*0.50;y<H;y+=45){
    ctx.beginPath();
    ctx.moveTo(W*0.15,y);
    ctx.lineTo(W*0.85,y);
    ctx.stroke();
  }
}

function drawTrainTop(){

  const topY=H*0.47;
  const bottomY=H;

  ctx.fillStyle="#26343c";

  ctx.beginPath();
  ctx.moveTo(W*0.17,topY);
  ctx.lineTo(W*0.83,topY);
  ctx.lineTo(W*0.94,bottomY);
  ctx.lineTo(W*0.06,bottomY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#9aa8ae";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(W*0.17,topY);
  ctx.lineTo(W*0.06,bottomY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*0.83,topY);
  ctx.lineTo(W*0.94,bottomY);
  ctx.stroke();

  // lane lines
  ctx.strokeStyle="#65757c";
  ctx.lineWidth=3;

  for(let l=1;l<3;l++){

    const topX=W*(0.17+l*0.22);
    const bottomX=W*(0.06+l*0.293);

    ctx.beginPath();
    ctx.moveTo(topX,topY);
    ctx.lineTo(bottomX,bottomY);
    ctx.stroke();
  }
}

function drawRunner(){

  const x=laneX(lane);
  const ground=H*0.78;

  const jumpHeight=jump*145;
  const y=ground-jumpHeight;

  ctx.save();
  ctx.translate(x,y);

  const run=Math.sin(performance.now()/80)*5;

  // shadow
  ctx.fillStyle="#00000055";
  ctx.beginPath();
  ctx.ellipse(0,35+jumpHeight*0.2,28,8,0,0,Math.PI*2);
  ctx.fill();

  // legs
  ctx.strokeStyle="#17202a";
  ctx.lineWidth=10;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-8,18);
  ctx.lineTo(-15+run,48);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(8,18);
  ctx.lineTo(15-run,48);
  ctx.stroke();

  // shoes
  ctx.strokeStyle="#f2f2f2";
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(-15+run,48);
  ctx.lineTo(-25+run,48);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(15-run,48);
  ctx.lineTo(25-run,48);
  ctx.stroke();

  // body
  ctx.fillStyle =
    selectedCharacter==="boy" ? "#1769d1" : "#d52d70";

  ctx.beginPath();
  ctx.roundRect(-18,-5,36,40,10);
  ctx.fill();

  // arms
  ctx.strokeStyle="#e1a078";
  ctx.lineWidth=9;

  ctx.beginPath();
  ctx.moveTo(-16,2);
  ctx.lineTo(-30,18+run);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(16,2);
  ctx.lineTo(30,18-run);
  ctx.stroke();

  // head
  ctx.fillStyle="#e1a078";
  ctx.beginPath();
  ctx.arc(0,-25,19,0,Math.PI*2);
  ctx.fill();

  // hair
  ctx.fillStyle="#191919";

  if(selectedCharacter==="boy"){
    ctx.beginPath();
    ctx.arc(0,-31,19,Math.PI,Math.PI*2);
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.arc(0,-30,20,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.fillRect(-20,-31,7,28);
    ctx.fillRect(13,-31,7,28);
  }

  ctx.restore();
}

function drawCoin(o){

  const x=laneX(o.lane);
  const y=H*0.46+o.z*H*0.34;
  const r=8+o.z*16;

  ctx.fillStyle="#ffd21c";

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff4a0";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#a66b00";
  ctx.font=Math.max(10,r)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("C",x,y);
}

function drawStar(o){

  const x=laneX(o.lane);
  const y=H*0.46+o.z*H*0.34;
  const r=9+o.z*14;

  ctx.fillStyle="#fff45c";

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const a=-Math.PI/2+i*Math.PI/5;
    const rr=i%2===0?r:r*0.45;

    const px=x+Math.cos(a)*rr;
    const py=y+Math.sin(a)*rr;

    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();
  ctx.fill();
}

function drawKey(o){

  const x=laneX(o.lane);
  const y=H*0.46+o.z*H*0.34;
  const r=8+o.z*12;

  ctx.strokeStyle="#6ee7ff";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.arc(x-5,y-4,r*0.65,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+1,y+3);
  ctx.lineTo(x+18,y+20);
  ctx.lineTo(x+11,y+27);
  ctx.moveTo(x+8,y+11);
  ctx.lineTo(x+16,y+3);
  ctx.stroke();
}

function drawObstacle(o){

  const x=laneX(o.lane);
  const y=H*0.46+o.z*H*0.34;

  const w=35+o.z*55;
  const h=22+o.z*38;

  ctx.fillStyle="#bd432f";

  ctx.beginPath();
  ctx.roundRect(
    x-w/2,
    y-h,
    w,
    h,
    6
  );
  ctx.fill();

  ctx.fillStyle="#f4d35e";

  for(let i=0;i<4;i++){

    ctx.fillRect(
      x-w/2+i*w/4,
      y-h+5,
      w/8,
      h-10
    );
  }
}

function spawnObject(){

  const r=Math.random();

  const lanePick=Math.floor(Math.random()*3);

  if(r<0.52){

    objects.push({
      type:"coin",
      lane:lanePick,
      z:0,
      collected:false
    });

  }else if(r<0.68){

    objects.push({
      type:"star",
      lane:lanePick,
      z:0,
      collected:false
    });

  }else if(r<0.78){

    objects.push({
      type:"key",
      lane:lanePick,
      z:0,
      collected:false
    });

  }else{

    objects.push({
      type:"obstacle",
      lane:lanePick,
      z:0,
      collected:false
    });
  }
}
function updateObjects(dt){

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    o.z += speed * dt * 0.00045;

    if(o.z > 1.05){
      objects.splice(i,1);
      continue;
    }

    const close = o.z > 0.78;

    if(close && !o.collected && o.lane === lane){

      if(o.type === "obstacle"){

        if(jump < 0.45){

          endGame();
          return;

        }

      }else{

        o.collected = true;

        if(o.type === "coin"){
          coins++;
          score += 25;
        }

        if(o.type === "star"){
          score += 75;
        }

        if(o.type === "key"){
          score += 100;
        }

      }
    }

    if(o.collected){
      objects.splice(i,1);
    }
  }
}

function updatePlayer(dt){

  const moveSpeed = 7 * dt;

  if(lane < targetLane){
    lane += moveSpeed;

    if(lane > targetLane){
      lane = targetLane;
    }
  }

  if(lane > targetLane){
    lane -= moveSpeed;

    if(lane < targetLane){
      lane = targetLane;
    }
  }

  if(jumping){

    jump += dt * 0.0018;

    if(jump >= 1){
      jump = 0;
      jumping = false;
    }
  }
}

function drawObjects(){

  for(const o of objects){

    if(o.collected) continue;

    if(o.type === "coin"){
      drawCoin(o);
    }

    if(o.type === "star"){
      drawStar(o);
    }

    if(o.type === "key"){
      drawKey(o);
    }

    if(o.type === "obstacle"){
      drawObstacle(o);
    }
  }
}

function drawGame(){

  drawBackground();
  drawTrainTop();
  drawObjects();
  drawRunner();
}

function loop(time){

  if(!running) return;

  const dt = Math.min(32,time-lastTime);

  lastTime = time;

  score += dt * 0.025;

  speed += dt * 0.00015;

  spawnTimer += dt;

  if(spawnTimer > Math.max(480,900-speed*30)){

    spawnObject();

    spawnTimer = 0;
  }

  updatePlayer(dt);
  updateObjects(dt);

  scoreEl.textContent = Math.floor(score);
  coinsEl.textContent = coins;

  drawGame();

  requestAnimationFrame(loop);
}

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{

  const t=e.touches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;

},{passive:true});

canvas.addEventListener("touchend",e=>{

  const t=e.changedTouches[0];

  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;

  if(Math.abs(dx)>Math.abs(dy)){

    if(Math.abs(dx)>35){

      if(dx>0){
        moveRight();
      }else{
        moveLeft();
      }
    }

  }else{

    if(Math.abs(dy)>35){

      if(dy<0){
        doJump();
      }else{
        doSlide();
      }
    }
  }

},{passive:true});

function preventScroll(e){
  e.preventDefault();
}

document.addEventListener(
  "touchmove",
  preventScroll,
  {passive:false}
);

window.addEventListener("blur",()=>{

  if(running){
    lastTime=performance.now();
  }

});
  </script>
</div>
</body>
</html>
