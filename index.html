<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#101a35">
<meta name="description" content="Run Blaze - Endless runner game">
<title>Run Blaze</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08101f;
  font-family:Arial,sans-serif;
  touch-action:none;
}

button{
  font-family:Arial,sans-serif;
  cursor:pointer;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ---------- HUD ---------- */

#hud{
  position:fixed;
  top:12px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:center;
  gap:6px;
  pointer-events:none;
}

.hudBox{
  min-width:62px;
  padding:7px 8px;
  border-radius:12px;
  background:rgba(7,15,31,.82);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-align:center;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

/* ---------- POWER ---------- */

#powerText{
  position:fixed;
  top:64px;
  left:0;
  right:0;
  z-index:6;
  text-align:center;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

/* ---------- HOME ---------- */

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  background:
    radial-gradient(circle at 50% 22%,rgba(40,150,255,.25),transparent 28%),
    linear-gradient(180deg,#0b1730 0%,#07101f 55%,#050b16 100%);
  padding:20px;
}

.homePanel{
  width:min(440px,94vw);
  text-align:center;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
}

.topStat{
  flex:1;
  padding:8px 6px;
  border-radius:14px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  color:#fff;
  font-size:13px;
  font-weight:bold;
}

.iconButton{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:21px;
}

.logo{
  font-size:62px;
  line-height:1;
  margin:8px 0 3px;
  filter:drop-shadow(0 5px 15px rgba(255,100,0,.4));
}

.gameTitle{
  margin:0;
  font-size:46px;
  font-weight:900;
  letter-spacing:1px;
  color:#ff7414;
  text-shadow:
    0 3px 0 #a93200,
    0 0 25px rgba(255,100,0,.45);
}

  color:#c
