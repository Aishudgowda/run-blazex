<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Run Blaze</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#07111d;
font-family:Arial,sans-serif;
touch-action:none
}

body{
display:flex;
justify-content:center;
align-items:center
}

#app{
position:relative;
width:min(100vw,520px);
height:100vh;
overflow:hidden;
background:#07111d
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block
}

.screen{
position:absolute;
inset:0;
z-index:20;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

#home{
background:
radial-gradient(circle at 50% 25%,#194d70 0,#0b2032 45%,#03080d 100%)
}

.logo{
font-size:clamp(42px,12vw,64px);
font-weight:900;
letter-spacing:2px;
color:#fff;
text-shadow:
0 5px 0 #07111d,
0 0 25px #ff6b00
}

.subtitle{
margin-top:8px;
color:#ffc46b;
letter-spacing:5px;
font-size:13px
}

.play{
margin-top:40px;
width:230px;
padding:18px;
border:0;
border-radius:18px;
background:linear-gradient(#ffb300,#ff5b00);
color:#fff;
font-size:25px;
font-weight:900;
box-shadow:0 7px 0 #8d3000,0 15px 30px #0008
}

.play:active{
transform:translateY(5px);
box-shadow:0 2px 0 #8d3000
}

.homeStats{
display:flex;
gap:12px;
margin-top:34px
}

.stat{
width:95px;
padding:12px 8px;
border-radius:14px;
text-align:center;
background:#ffffff12;
border:1px solid #ffffff20
}

.stat b{
display:block;
font-size:21px
}

.stat span{
font-size:10px;
color:#a8bac8
}

.brand{
position:absolute;
bottom:18px;
color:#7890a2;
font-size:11px;
letter-spacing:2px
}

#hud{
position:absolute;
top:12px;
left:12px;
right:12px;
z-index:10;
display:none;
justify-content:space-between;
pointer-events:none
}

.hud{
min-width:92px;
padding:8px 12px;
border-radius:12px;
background:#04101bcc;
border:1px solid #ffffff22
}

.hud small{
display:block;
color:#91a6b6;
font-size:9px;
text-transform:uppercase
}

.hud strong{
font-size:20px
}

#power{
position:absolute;
top:70px;
left:50%;
transform:translateX(-50%);
z-index:11;
display:none;
padding:7px 14px;
border-radius:20px;
background:#ff790044;
border:1px solid #ffb00088;
font-size:12px;
font-weight:bold
}

#controls{
position:absolute;
bottom:14px;
left:12px;
right:12px;
z-index:12;
display:none;
justify-content:space-between;
pointer-events:none
}

.controlGroup{
display:flex;
gap:9px;
pointer-events:auto
}

.ctrl{
width:58px;
height:58px;
border-radius:17px;
border:1px solid #ffffff28;
background:#06111ddd;
color:#fff;
font-size:25px;
font-weight:bold;
box-shadow:0 5px 15px #0008
}

.ctrl:active{
transform:scale(.93);
background:#ffffff22
}

#gameOver{
display:none;
background:#02070dcc;
backdrop-filter:blur(5px)
}

.gameOverTitle{
font-size:48px;
font-weight:900;
color:#ff7600;
text-shadow:0 4px #5a1e00
}

.result{
margin-top:15px;
font-size:19px
}

.again{
margin-top:25px;
padding:15px 30px;
border-radius:15px;
background:#ff6500;
color:#fff;
font-size:19px;
font-weight:bold
}

#tip{
position:absolute;
top:75px;
left:50%;
transform:translateX(-50%);
z-index:9;
color:#ffffffaa;
font-size:11px;
white-space:nowrap
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas"></canvas>

<div id="home" class="screen">

<div class="logo">RUN BLAZE</div>

<div class="subtitle">
ENDLESS RUNNER
</div>

<button id="playBtn" class="play">
▶ PLAY
</button>

<div class="homeStats">

<div class="stat">
<b id="homeBest">0</b>
<span>BEST</span>
</div>

<div class="stat">
<b>3</b>
<span>LANES</span>
</div>

<div class="stat">
<b>∞</b>
<span>RUN</span>
</div>

</div>

<div class="brand">
PLAYTECH STUDIO
</div>

</div>


<div id="hud">

<div class="hud">
<small>Score</small>
<strong id="scoreText">0</strong>
</div>

<div class="hud">
<small>Coins</small>
<strong id="coinText">0</strong>
</div>

</div>


<div id="power"></div>

<div id="tip">
← → Lane &nbsp; ↑ Jump &nbsp; ↓ Slide
</div>


<div id="controls">

<div class="controlGroup">

<button class="ctrl" id="leftBtn">
◀
</button>

<button class="ctrl" id="rightBtn">
▶
</button>

</div>

<div class="controlGroup">

<button class="ctrl" id="jumpBtn">
▲
</button>

<button class="ctrl" id="slideBtn">
▼
</button>

</div>

</div>


<div id="gameOver" class="screen">

<div class="gameOverTitle">
GAME OVER
</div>

<div class="result">
Score:
<b id="finalScore">0</b>

&nbsp;&nbsp;

Coins:
<b id="finalCoins">0</b>
</div>

<button id="againBtn" class="again">
↻ PLAY AGAIN
</button>

<div class="brand">
PLAYTECH STUDIO
</div>

</div>

</div>


<script>

"use strict";


const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const home =
document.getElementById("home");

const hud =
document.getElementById("hud");

const controls =
document.getElementById("controls");

const gameOver =
document.getElementById("gameOver");

const scoreText =
document.getElementById("scoreText");

const coinText =
document.getElementById("coinText");

const finalScore =
document.getElementById("finalScore");

const finalCoins =
document.getElementById("finalCoins");

const homeBest =
document.getElementById("homeBest");

const power =
document.getElementById("power");

const tip =
document.getElementById("tip");


let W = 0;
let H = 0;
let DPR = 1;


function resize(){

DPR =
Math.min(
window.devicePixelRatio || 1,
2
);

W =
window.innerWidth;

H =
window.innerHeight;

canvas.width =
W * DPR;

canvas.height =
H * DPR;

canvas.style.width =
W + "px";

canvas.style.height =
H + "px";

ctx.setTransform(
DPR,
0,
0,
DPR,
0,
0
);

}


window.addEventListener(
"resize",
resize
);

resize();


let running = false;

let score = 0;

let coins = 0;

let best =
Number(
localStorage.getItem(
"runBlazeBest"
) || 0
);

homeBest.textContent =
best;


let targetLane = 0;

let playerLane = 0;

let playerY = 0;

let verticalVelocity = 0;

let jumping = false;

let sliding = false;

let slideTimer = 0;

let gameSpeed = 0.38;

let spawnTimer = 0;

let roadOffset = 0;

let lastTime = 0;

let objects = [];

let magnetTimer = 0;

let boostTimer = 0;

let skateTimer = 0;


function horizonY(){

return H * 0.28;

}


function groundY(){

return H * 0.87;

}


function laneX(lane){

return (
W / 2 +
lane * (W * 0.72 / 3)
);

}


function startGame(){

home.style.display =
"none";

gameOver.style.display =
"none";

hud.style.display =
"flex";

controls.style.display =
"flex";

tip.style.display =
"block";

running = true;

score = 0;

coins = 0;

targetLane = 0;

playerLane = 0;

playerY = 0;

verticalVelocity = 0;

jumping = false;

sliding = false;

slideTimer = 0;

gameSpeed = 0.38;

spawnTimer = 0.5;

roadOffset = 0;

magnetTimer = 0;

boostTimer = 0;

skateTimer = 0;

objects = [];

lastTime =
performance.now();

requestAnimationFrame(loop);

}


function endGame(){

if(!running){
return;
}

running = false;

finalScore.textContent =
Math.floor(score);

finalCoins.textContent =
coins;

if(score > best){

best =
Math.floor(score);

localStorage.setItem(
"runBlazeBest",
best
);

homeBest.textContent =
best;

}

hud.style.display =
"none";

controls.style.display =
"none";

gameOver.style.display =
"flex";

}


function moveLeft(){

if(!running){
return;
}

targetLane--;

if(targetLane < -1){
targetLane = -1;
}

}


function moveRight(){

if(!running){
return;
}

targetLane++;

if(targetLane > 1){
targetLane = 1;
}

}


function jump(){

if(!running){
return;
}

if(jumping){
return;
}

sliding = false;

slideTimer = 0;

jumping = true;

playerY = 0;

verticalVelocity = 1.35;

}


function slide(){

if(!running){
return;
}

if(jumping){

if(playerY > 0.35){
verticalVelocity = -1.8;
}

return;
}

sliding = true;

slideTimer = 0.65;

}


function createObject(){

const r =
Math.random();

let type;

if(r < 0.54){
type = "coin";
}
else if(r < 0.64){
type = "star";
}
else if(r < 0.72){
type = "key";
}
else if(r < 0.77){
type = "magnet";
}
else if(r < 0.82){
type = "boost";
}
else if(r < 0.86){
type = "skate";
}
else{
type = "obstacle";
}

objects.push({

lane:
Math.floor(
Math.random() * 3
) - 1,

z:1.12,

type:type,

collected:false

});

}


function createCoinLine(){

const lane =
Math.floor(
Math.random() * 3
) - 1;

for(
let i = 0;
i < 5;
i++
){

objects.push({

lane:lane,

z:
1.1 +
i * 0.075,

type:"coin",

collected:false

});

}

}


function createObstacle(){

objects.push({

lane:
Math.floor(
Math.random() * 3
) - 1,

z:1.12,

type:"obstacle",

collected:false

});

}


function spawnObjects(dt){

spawnTimer -= dt;

if(spawnTimer > 0){
return;
}

const r =
Math.random();

if(r < 0.18){

createCoinLine();

}
else if(r < 0.42){

createObstacle();

}
else{

createObject();

}

spawnTimer =
Math.max(
0.42,
0.85 -
gameSpeed * 0.35
);

}


function updatePlayer(dt){

playerLane +=
(
targetLane -
playerLane
) *
Math.min(
1,
7.5 * dt
);


if(jumping){

playerY +=
verticalVelocity * dt;

verticalVelocity -=
3.7 * dt;

if(playerY <= 0){

playerY = 0;

verticalVelocity = 0;

jumping = false;

}

}


if(sliding){

slideTimer -= dt;

if(slideTimer <= 0){

slideTimer = 0;

sliding = false;

}

}

}


function collectObject(o){

if(o.collected){
return;
}

o.collected = true;


if(o.type === "coin"){

coins++;

score += 50;

}


else if(o.type === "star"){

score += 150;

}


else if(o.type === "key"){

score += 300;

}


else if(o.type === "magnet"){

magnetTimer = 8;

}


else if(o.type === "boost"){

boostTimer = 5;

}


else if(o.type === "skate"){

skateTimer = 8;

}

}


function updateObjects(dt){

for(
let i = objects.length - 1;
i >= 0;
i--
){

const o =
objects[i];

o.z -=
gameSpeed * dt;


if(o.collected){

objects.splice(i,1);

continue;

}


/* MAGNET */

if(
magnetTimer > 0 &&
o.type === "coin" &&
o.z < 0.65 &&
o.z > 0.02
){

if(
Math.abs(
o.lane -
targetLane
) <= 1
){

o.lane =
targetLane;

}

}


/* COLLISION */

if(
o.z < 0.105 &&
o.z > 0.015 &&
Math.abs(
o.lane -
playerLane
) < 0.34
){

if(o.type === "obstacle"){

/* JUMP OVER STONE */

if(playerY > 0.32){

o.collected = true;

}

/* SKATE PROTECTS ONCE */

else if(skateTimer > 0){

skateTimer = 0;

o.collected = true;

}

/* HIT = GAME OVER */

else{

endGame();

return;

}

}

else{

collectObject(o);

}

}


/* REMOVE OLD OBJECT */

if(o.z < -0.12){

objects.splice(i,1);

}

}

}


function drawSky(){

const gradient =
ctx.createLinearGradient(
0,
0,
0,
H
);

gradient.addColorStop(
0,
"#58b8ed"
);

gradient.addColorStop(
0.45,
"#b9e8ff"
);

gradient.addColorStop(
1,
"#e8f5fa"
);

ctx.fillStyle =
gradient;

ctx.fillRect(
0,
0,
W,
H
);

}


function drawSun(){

ctx.fillStyle =
"#ffe79a";

ctx.beginPath();

ctx.arc(
W * 0.78,
H * 0.17,
42,
0,
Math.PI * 2
);

ctx.fill();

}


function drawCity(){

const base =
horizonY() + 35;

for(
let i = 0;
i < 12;
i++
){

const x =
i * (W / 10) - 20;

const height =
25 +
(i * 17) % 75;

ctx.fillStyle =
i % 2 ?
"#6d8796" :
"#7899a9";

ctx.fillRect(
x,
base - height,
55,
height
);

ctx.fillStyle =
"#d7edf2";

for(
let y =
base - height + 10;
y <
base - 8;
y += 15
){

ctx.fillRect(
x + 9,
y,
6,
6
);

ctx.fillRect(
x + 28,
y,
6,
6
);

}

}

}


function drawRoad(){

const hy =
horizonY();

const gy =
groundY();

const topWidth =
W * 0.16;

const bottomWidth =
W * 0.95;


ctx.beginPath();

ctx.moveTo(
W / 2 - topWidth / 2,
hy
);

ctx.lineTo(
W / 2 + topWidth / 2,
hy
);

ctx.lineTo(
W / 2 + bottomWidth / 2,
gy
);

ctx.lineTo(
W / 2 - bottomWidth / 2,
gy
);

ctx.closePath();

ctx.fillStyle =
"#30343a";

ctx.fill();


/* ROAD EDGES */

ctx.strokeStyle =
"#dddddd";

ctx.lineWidth = 5;

ctx.beginPath();

ctx.moveTo(
W / 2 - topWidth / 2,
hy
);

ctx.lineTo(
W / 2 - bottomWidth / 2,
gy
);

ctx.moveTo(
W / 2 + topWidth / 2,
hy
);

ctx.lineTo(
W / 2 + bottomWidth / 2,
gy
);

ctx.stroke();


/* LANE LINES */

roadOffset =
(
roadOffset +
gameSpeed * 0.012
) % 1;


for(
const lane of [-1,1]
){

for(
let i = 0;
i < 18;
i++
){

const t =
(
i / 18 +
roadOffset
) % 1;

const y =
hy +
(gy - hy) * t;

const width =
topWidth +
(bottomWidth - topWidth) * t;

const x =
W / 2 +
lane * (width / 3);

const dash =
4 +
t * 30;

ctx.strokeStyle =
"#ffffffaa";

ctx.lineWidth =
2 +
t * 3;

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
x,
y + dash
);

ctx.stroke();

}

}

}


function objectPosition(o){

const t =
Math.max(
0,
Math.min(
1,
1 - o.z
)
);

const hy =
horizonY();

const gy =
groundY();

const y =
hy +
(gy - hy) * t;

const topWidth =
W * 0.16;

const bottomWidth =
W * 0.95;

const width =
topWidth +
(bottomWidth - topWidth) * t;

const x =
W / 2 +
o.lane * (width / 3);

return{

x:x,

y:y,

scale:
0.25 +
t * 1.4

};

}


function drawStar(
x,
y,
r
){

ctx.fillStyle =
"#ffe331";

ctx.beginPath();

for(
let i = 0;
i < 10;
i++
){

const angle =
-Math.PI / 2 +
i * Math.PI / 5;

const radius =
i % 2 === 0 ?
r :
r * 0.45;

const px =
x +
Math.cos(angle) *
radius;

const py =
y +
Math.sin(angle) *
radius;

if(i === 0){

ctx.moveTo(
px,
py
);

}
else{

ctx.lineTo(
px,
py
);

}

}

ctx.closePath();

ctx.fill();

}


function drawObjects(){

const sorted =
[...objects].sort(
(a,b) =>
b.z - a.z
);


for(
const o of sorted
){

if(o.collected){
continue;
}

const p =
objectPosition(o);

const s =
p.scale;

ctx.save();

ctx.translate(
p.x,
p.y
);


if(o.type === "coin"){

ctx.rotate(
performance.now() / 250
);

ctx.fillStyle =
"#ffd21c";

ctx.beginPath();

ctx.arc(
0,
-25 * s,
15 * s,
0,
Math.PI * 2
);

ctx.fill();

ctx.fillStyle =
"#fff29a";

ctx.font =
`${12*s}px Arial`;

ctx.textAlign =
"center";

ctx.fillText(
"$",
0,
-21 * s
);

}


else if(o.type === "star"){

drawStar(
0,
-28 * s,
17 * s
);

}


else if(o.type === "key"){

ctx.strokeStyle =
"#ffdc39";

ctx.lineWidth =
7 * s;

ctx.beginPath();

ctx.arc(
-5*s,
-30*s,
9*s,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(
3*s,
-30*s
);

ctx.lineTo(
22*s,
-30*s
);

ctx.lineTo(
18*s,
-23*s
);

ctx.moveTo(
14*s,
-30*s
);

ctx.lineTo(
10*s,
-24*s
);

ctx.stroke();

}


else if(o.type === "magnet"){

ctx.font =
`${30*s}px Arial`;

ctx.textAlign =
"center";

ctx.fillText(
"🧲",
0,
-25*s
);

}


else if(o.type === "boost"){

ctx.font =
`${30*s}px Arial`;

ctx.textAlign =
"center";

ctx.fillText(
"🔥",
0,
-25*s
);

}


else if(o.type === "skate"){

ctx.font =
`${30*s}px Arial`;

ctx.textAlign =
"center";

ctx.fillText(
"🛹",
0,
-25*s
);

}


else if(o.type === "obstacle"){

const width =
42*s;

const height =
45*s;

ctx.fillStyle =
"#60666d";

ctx.fillRect(
-width/2,
-height,
width,
height
);

ctx.fillStyle =
"#858b91";

ctx.fillRect(
-width/2 + 5*s,
-height + 5*s,
width - 10*s,
8*s
);

ctx.strokeStyle =
"#252a2f";

ctx.lineWidth =
4*s;

ctx.strokeRect(
-width/2,
-height,
width,
height
);

}

ctx.restore();

}

}


function drawPlayer(){

const x =
laneX(playerLane);

const baseY =
groundY() -
12 -
playerY * 180;

const time =
performance.now() / 100;

const bob =
jumping ?
0 :
Math.sin(
time * 0.8
) * 4;


ctx.save();

ctx.translate(
x,
baseY
);


/* SHADOW */

ctx.globalAlpha =
0.35;

ctx.fillStyle =
"#000";

ctx.beginPath();

ctx.ellipse(
0,
6,
25,
8,
0,
0,
Math.PI * 2
);

ctx.fill();

ctx.globalAlpha = 1;


/* SKATE */

if(skateTimer > 0){

ctx.strokeStyle =
"#66e8ff";

ctx.lineWidth = 4;

ctx.beginPath();

ctx.arc(
0,
-28,
34,
0,
Math.PI * 2
);

ctx.stroke();

}


/* BOOST */

if(boostTimer > 0){

ctx.fillStyle =
"#ff7b00";

ctx.beginPath();

ctx.moveTo(
-10,
25
);

ctx.lineTo(
0,
55
);

ctx.lineTo(
10,
25
);

ctx.closePath();

ctx.fill();

}


const bodyY =
bob +
(sliding ? 15 : 0);


/* BODY */

ctx.fillStyle =
"#e94d25";

ctx.fillRect(
-15,
bodyY - 45,
30,
40
);


/* HEAD */

ctx.fillStyle =
"#f2b37f";

ctx.beginPath();

ctx.arc(
0,
bodyY - 60,
14,
0,
Math.PI * 2
);

ctx.fill();


/* HAIR */

ctx.fillStyle =
"#211914";

ctx.beginPath();

ctx.arc(
0,
bodyY - 65,
14,
Math.PI,
Math.PI * 2
);

ctx.fill();


/* RUNNING LEGS */

const legMove =
sliding ?
0 :
Math.sin(
time * 0.8
) * 9;

ctx.strokeStyle =
"#26384b";

ctx.lineWidth = 8;

ctx.lineCap =
"round";

ctx.beginPath();

ctx.moveTo(
-7,
bodyY - 7
);

ctx.lineTo(
-13 + legMove,
bodyY + 19
);

ctx.moveTo(
7,
bodyY - 7
);

ctx.lineTo(
13 - legMove,
bodyY + 19
);

ctx.stroke();


/* RUNNING ARMS */

const armMove =
Math.sin(
time * 0.8
) * 12;

ctx.strokeStyle =
"#e3a272";

ctx.lineWidth = 7;

ctx.beginPath();

ctx.moveTo(
-13,
bodyY - 37
);

ctx.lineTo(
-25 - armMove * .5,
bodyY - 18
);

ctx.moveTo(
13,
bodyY - 37
);

ctx.lineTo(
25 + armMove * .5,
bodyY - 18
);

ctx.stroke();


ctx.restore();

}


function updateUI(){

scoreText.textContent =
Math.floor(score);

coinText.textContent =
coins;


if(magnetTimer > 0){

power.textContent =
"🧲 MAGNET " +
Math.ceil(
magnetTimer
);

power.style.display =
"block";

}

else if(boostTimer > 0){

power.textContent =
"🔥 BOOST " +
Math.ceil(
boostTimer
);

power.style.display =
"block";

}

else if(skateTimer > 0){

power.textContent =
"🛹 SKATE " +
Math.ceil(
skateTimer
);

power.style.display =
"block";

}

else{

power.style.display =
"none";

}

}


function draw(){

ctx.clearRect(
0,
0,
W,
H
);

drawSky();

drawSun();

drawCity();

drawRoad();

drawObjects();

drawPlayer();

}


function loop(now){

if(!running){

draw();

return;

}


let dt =
(now - lastTime) /
1000;

lastTime =
now;


dt =
Math.min(
dt,
0.035
);


/* SPEED INCREASE */

gameSpeed +=
dt * 0.006;


if(boostTimer > 0){

boostTimer -= dt;

gameSpeed +=
dt * 0.18;

}


if(magnetTimer > 0){

magnetTimer -= dt;

}


if(skateTimer > 0){

skateTimer -= dt;

}


score +=
dt *
(
70 +
gameSpeed * 80
);


spawnObjects(dt);

updatePlayer(dt);

updateObjects(dt);

updateUI();

draw();


requestAnimationFrame(
loop
);

}


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "ArrowLeft" ||
e.key.toLowerCase() === "a"
){

e.preventDefault();

moveLeft();

}

else if(
e.key === "ArrowRight" ||
e.key.toLowerCase() === "d"
){

e.preventDefault();

moveRight();

}

else if(
e.key === "ArrowUp" ||
e.key === " " ||
e.key.toLowerCase() === "w"
){

e.preventDefault();

jump();

}

else if(
e.key === "ArrowDown" ||
e.key.toLowerCase() === "s"
){

e.preventDefault();

slide();

}

});


/* BUTTONS */

document
.getElementById("playBtn")
.addEventListener(
"click",
startGame
);


document
.getElementById("againBtn")
.addEventListener(
"click",
startGame
);


document
.getElementById("leftBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveLeft();

});


document
.getElementById("rightBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

moveRight();

});


document
.getElementById("jumpBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

jump();

});


document
.getElementById("slideBtn")
.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

slide();

});


/* SWIPE */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(
"touchstart",
function(e){

const t =
e.changedTouches[0];

touchStartX =
t.clientX;

touchStartY =
t.clientY;

},
{
passive:false
}
);


canvas.addEventListener(
"touchend",
function(e){

if(!running){
return;
}

const t =
e.changedTouches[0];

const dx =
t.clientX -
touchStartX;

const dy =
t.clientY -
touchStartY;

const ax =
Math.abs(dx);

const ay =
Math.abs(dy);

if(
ax < 35 &&
ay < 35
){

return;

}


if(ax > ay){

if(dx > 0){

moveRight();

}
else{

moveLeft();

}

}
else{

if(dy < 0){

jump();

}
else{

slide();

}

}

},
{
passive:false
}
);


/* START DRAW */

draw();

</script>
