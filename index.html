<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b00">
<meta name="description" content="Run Blaze - Run, collect coins, use power-ups and beat your high score.">

<title>Run Blaze</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #111;
}

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
}

.hudBox {
    background: rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    padding: 9px 13px;
    font-weight: bold;
    font-size: 15px;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
        radial-gradient(circle at 50% 35%, #ff6b0030, transparent 35%),
        #080808;
    padding: 25px;
}

.panel {
    width: min(420px, 92vw);
}

.logo {
    font-size: 64px;
    margin-bottom: 5px;
}

h1 {
    font-size: 42px;
    margin: 0;
    color: #ff6b00;
    text-shadow: 0 0 25px #ff6b0080;
}

.subtitle {
    color: #ccc;
    font-size: 17px;
    margin: 10px 0 25px;
}

.features {
    text-align: left;
    line-height: 2;
    color: #ddd;
    margin-bottom: 25px;
}

button {
    border: 0;
    border-radius: 16px;
    padding: 16px 30px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff7a00, #ff3d00);
    box-shadow: 0 8px 25px #ff550050;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

.small {
