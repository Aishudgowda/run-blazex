<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Blaze | Playtech Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#122332;color:white}
canvas{display:block;width:100vw;height:100dvh}
button{padding:13px 18px;border:0;border-radius:12px;background:#f97316;color:white;font-weight:bold;font-size:17px;cursor:pointer}
#home,#over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#081725d9;padding:20px}
.card{width:min(380px,100%);padding:25px;background:#142638;border:1px solid #516579;border-radius:22px;text-align:center}
h1{font-size:44px;color:#fb923c;margin:5px}
.choice{background:#304456;margin:5px}
.selected{outline:3px solid #fb923c}
#playBtn,#againBtn{width:100%;margin-top:15px}
#over{display:none}
#hud{position:absolute;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:6px}
.stat{padding:9px;background:#102235e8;border-radius:10px;font-weight:bold}
#controls{position:absolute;bottom:15px;left:12px;right:12px;display:none;justify-content:space-between}
#controls button{padding:12px;min-width:48px;background:#142638e8}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="stat">Score: <span id="score">0</span></div>
 <div class="stat">🪙 <span id="coins">0</span></div>
 <div class="stat">⭐ <span id="stars">0</span></div>
 <button id="pauseBtn">Ⅱ</button>
</div>

<div id="home">
 <div class="card">
  <h1>RUN BLAZE</h1>
  <p>Run. Collect. Survive.</p>
  <p>Choose your character</p>
  <button class="choice selected" id="boyBtn">Boy</button>
  <button class="choice" id="girlBtn">Girl</button>
  <br>
  <button id="playBtn">▶ PLAY NOW</button>
  <p>PLAYTECH STUDIO</p>
 </div>
</div>

<div id="over">
 <div class="card">
  <h1>GAME OVER</h1>
  <p>Your score: <b id="finalScore">0</b></p>
  <p>Coins: <b id="finalCoins">0</b></p>
  <button id="againBtn">PLAY AGAIN</button><br><br>
  <button id="homeBtn">HOME</button>
 </div>
</div>

<div id="controls">
 <div>
  <button id="leftBtn">◀</button>
  <button id="rightBtn">▶</button>
 </div>
 <div>
  <button id="jumpBtn">⬆ Jump</button>
  <button id="slideBtn">⬇ Slide</button>
  <button id="boostBtn">⚡</button>
 </div>
</div>

<script>
(function(){
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 W=innerWidth;H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const boyImage=new Image();
boyImage.src="run_blaze_boy.png";
const girlImage=new Image();
girlImage.src="run_blaze_girl.png";

let character="boy",playing=false,paused=false;
let lane=1,playerLane=1,score=0,coins=0,stars=0;
let speed=330,items=[],last=0,spawn=0;
let jumpEnd=0,slideEnd=0,boostEnd=0,magnetEnd=0,skateEnd=0;
let best=0;
try{best=Number(localStorage.getItem("runBlazeBest"))||0}catch(e){}

function laneX(l,y){
 const p=Math.max(0,Math.min(1,(y-H*.25)/(H*.75)));
 return W/2+(l-1)*W*(.09+.28*p);
}
function choose(c){
 character=c;
 $("boyBtn").classList.toggle("selected",c==="boy");
 $("girlBtn").classList.toggle("selected",c==="girl");
}
$("boyBtn").onclick=()=>choose("boy");
$("girlBtn").onclick=()=>choose("girl");

function start(){
 playing=true;paused=false;lane=1;playerLane=1;
 score=0;coins=0;stars=0;speed=330;
 items=[];spawn=.5;last=0;
 jumpEnd=slideEnd=boostEnd=magnetEnd=skateEnd=0;
 $("home").style.display="none";
 $("over").style.display="none";
 $("hud").style.display="flex";
 $("controls").style.display="flex";
 $("pauseBtn").textContent="Ⅱ";
 updateHud();
}
$("playBtn").onclick=start;
$("againBtn").onclick=start;
$("homeBtn").onclick=()=>{
 playing=false;
 $("over").style.display="none";
 $("home").style.display="flex";
};
$("pauseBtn").onclick=()=>{
 if(!playing)return;
 paused=!paused;
 $("pauseBtn").textContent=paused?"▶":"Ⅱ";
 last=0;
};

function left(){if(playing&&!paused)lane=Math.max(0,lane-1)}
function right(){if(playing&&!paused)lane=Math.min(2,lane+1)}
function jump(){if(playing&&!paused)jumpEnd=performance.now()+700}
function slide(){if(playing&&!paused)slideEnd=performance.now()+650}
function boost(){if(playing&&!paused)boostEnd=performance.now()+2500}

$("leftBtn").onclick=left;
$("rightBtn").onclick=right;
$("jumpBtn").onclick=jump;
$("slideBtn").onclick=slide;
$("boostBtn").onclick=boost;

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 if(e.repeat)return;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left();
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right();
 if(e.key==="ArrowUp"||e.key===" ")jump();
 if(e.key==="ArrowDown")slide();
 if(e.key.toLowerCase()==="b")boost();
 if(e.key==="Escape"&&playing)$("pauseBtn").click();
});

let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{
 sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;
},{passive:true});
canvas.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-sx;
 const dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)<25&&Math.abs(dy)<25)return;
 if(Math.abs(dx)>Math.abs(dy)){dx<0?left():right()}
 else{dy<0?jump():slide()}
},{passive:true});

function spawnItem(){
 const r=Math.random();
 let type="obstacle";
 if(r<.40)type="coin";
 else if(r<.47)type="star";
 else if(r<.52)type="key";
 else if(r<.57)type="gift";
 else if(r<.61)type="magnet";
 else if(r<.65)type="boost";
 else if(r<.69)type="skate";
 else if(r<.83)type="barrier";
 items.push({lane:Math.floor(Math.random()*3),y:H*.25,type,done:false});
}
function updateHud(){
 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("stars").textContent=stars;
}
function gameEnd(){
 playing=false;
 best=Math.max(best,Math.floor(score));
 try{localStorage.setItem("runBlazeBest",String(best))}catch(e){}
 $("finalScore").textContent=Math.floor(score);
 $("finalCoins").textContent=coins;
 $("over").style.display="flex";
 $("hud").style.display="none";
 $("controls").style.display="none";
}
function collect(it,now){
 it.done=true;
 if(it.type==="coin"){coins++;score+=10}
 if(it.type==="star"){stars++;score+=50}
 if(it.type==="key"){score+=25}
 if(it.type==="gift"){coins+=5;score+=100}
 if(it.type==="magnet")magnetEnd=now+6000;
 if(it.type==="boost")boostEnd=now+2500;
 if(it.type==="skate")skateEnd=now+5000;
 updateHud();
}
function update(dt,now){
 speed=Math.min(600,speed+dt*5);
 score+=dt*(now<boostEnd?20:10);
 spawn-=dt;
 if(spawn<=0){
  spawnItem();spawn=Math.max(.5,1.15-speed/1000)+Math.random()*.3;
 }
 const py=H*.82;
 for(const it of items){
  if(it.done)continue;
  it.y+=speed*dt;
  if(now<magnetEnd&&it.type==="coin"&&it.y>H*.5)it.lane=Math.round(playerLane);
  if(it.lane===Math.round(playerLane)&&Math.abs(it.y-py)<32){
   if(["coin","star","key","gift","magnet","boost","skate"].includes(it.type)){
    collect(it,now);
   }else if(now<jumpEnd||now<slideEnd||now<skateEnd){
    it.done=true;score+=5;
   }else{gameEnd();return}
  }
 }
 items=items.filter(it=>it.y<H+80&&!it.done);
 updateHud();
}
function drawTrack(now){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#16354c");sky.addColorStop(.55,"#43848a");sky.addColorStop(1,"#b8b9a0");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 ctx.fillStyle="#1e5948";
 for(let i=0;i<9;i++){
  const x=(i*W/8+now*.012)%(W+60)-30;
  ctx.beginPath();ctx.moveTo(x,H*.25);ctx.lineTo(x-48,H*.52);ctx.lineTo(x+48,H*.52);ctx.fill();
 }
 ctx.fillStyle="#414d5a";
 ctx.beginPath();ctx.moveTo(W*.38,H*.25);ctx.lineTo(W*.62,H*.25);
 ctx.lineTo(W*1.1,H);ctx.lineTo(-W*.1,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#d5dbe0";ctx.lineWidth=2;
 for(let i=0;i<2;i++){
  ctx.beginPath();ctx.moveTo(W/2+(i-.5)*W*.12,H*.25);
  ctx.lineTo(W/2+(i-.5)*W*.72,H);ctx.stroke();
 }
}
function drawItem(it){
 const x=laneX(it.lane,it.y);
 const s=.4+Math.max(0,(it.y-H*.25)/(H*.75))*1.1;
 ctx.save();ctx.translate(x,it.y);ctx.scale(s,s);
 const icons={coin:"🪙",star:"⭐",key:"🔑",gift:"🎁",magnet:"🧲",boost:"⚡",skate:"🛹"};
 if(icons[it.type]){
  ctx.font="30px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(icons[it.type],0,0);
 }else{
  ctx.fillStyle=it.type==="barrier"?"#f97316":"#dc2626";
  ctx.fillRect(-25,-30,50,60);
  ctx.fillStyle="#fff";ctx.fillRect(-24,-8,48,8);
 }
 ctx.restore();
}
function drawPlayer(now,dt){
 playerLane+=(lane-playerLane)*Math.min(1,dt*12);
 const x=laneX(playerLane,H*.82);
 let y=H*.82;
 if(now<jumpEnd)y-=Math.sin((1-(jumpEnd-now)/700)*Math.PI)*H*.2;
 if(now<slideEnd)y+=H*.03;
 const img=character==="boy"?boyImage:girlImage;
 const w=Math.min(100,W*.21),h=w*1.35;
 if(img.complete&&img.naturalWidth>0){
  ctx.drawImage(img,x-w/2,y-h,w,h);
 }else{
  ctx.font=`${w*.85}px Arial`;
  ctx.textAlign="center";ctx.textBaseline="bottom";
  ctx.fillText(character==="boy"?"🏃":"🏃‍♀️",x,y);
 }
}
function render(now,dt){
 drawTrack(now);
 items.slice().sort((a,b)=>a.y-b.y).forEach(drawItem);
 drawPlayer(now,dt);
 if(playing&&paused){
  ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";ctx.font="bold 32px Arial";ctx.textAlign="center";
  ctx.fillText("PAUSED",W/2,H/2);
 }
}
function loop(now){
 requestAnimationFrame(loop);
 const dt=last?Math.min((now-last)/1000,.04):0;
 last=now;
 if(playing&&!paused)update(dt,now);
 render(now,dt);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
